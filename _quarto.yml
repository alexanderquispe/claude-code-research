project:
  type: default
  output-dir: docs
  render:
    - index.qmd
    - ras/day1-foundations.qmd
    - ras/day2-power-tools.qmd
    - profesores/sesion1-confianza.qmd
    - profesores/sesion2-flujo.qmd

format:
  revealjs:
    theme: [default, ../styles/theme.scss]
    slide-number: c/t
    hash: true
    transition: fade
    transition-speed: fast
    fragments: false
    incremental: false
    code-copy: true
    code-line-numbers: false
    highlight-style: github
    footer: "Claude Code for Research — Q-LAB PUCP · August 2026"
    center-title-slide: true
    controls: true
    progress: true
    history: true
    pdf-separate-fragments: false
