<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arc1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0e7c86"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- cards: each version is a photo of the folder -->
  <!-- Monday -->
  <g>
    <rect x="55" y="38" width="170" height="112" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="1.5"/>
    <text x="140" y="60" font-size="14" text-anchor="middle" font-weight="700" fill="#0f2d52">Monday</text>
    <text x="140" y="79" font-size="12.5" text-anchor="middle" font-style="italic" fill="#556">starting point</text>
    <rect x="80" y="96" width="120" height="6" rx="3" fill="#d5dbe6"/>
    <rect x="80" y="108" width="92" height="6" rx="3" fill="#d5dbe6"/>
    <rect x="80" y="120" width="108" height="6" rx="3" fill="#d5dbe6"/>
    <line x1="140" y1="150" x2="140" y2="196" stroke="#0f2d52" stroke-width="1.5"/>
  </g>
  <!-- Tuesday -->
  <g>
    <rect x="305" y="38" width="170" height="112" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="1.5"/>
    <text x="390" y="60" font-size="14" text-anchor="middle" font-weight="700" fill="#0f2d52">Tuesday</text>
    <text x="390" y="79" font-size="12.5" text-anchor="middle" font-style="italic" fill="#556">introduction rewritten</text>
    <rect x="330" y="96" width="120" height="6" rx="3" fill="#9db4d4"/>
    <rect x="330" y="108" width="92" height="6" rx="3" fill="#d5dbe6"/>
    <rect x="330" y="120" width="108" height="6" rx="3" fill="#d5dbe6"/>
    <line x1="390" y1="150" x2="390" y2="196" stroke="#0f2d52" stroke-width="1.5"/>
  </g>
  <!-- Wednesday -->
  <g>
    <rect x="555" y="38" width="170" height="112" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="1.5"/>
    <text x="640" y="60" font-size="14" text-anchor="middle" font-weight="700" fill="#0f2d52">Wednesday</text>
    <text x="640" y="79" font-size="12.5" text-anchor="middle" font-style="italic" fill="#556">Ombudsmans tables</text>
    <rect x="580" y="96" width="120" height="6" rx="3" fill="#9db4d4"/>
    <rect x="580" y="108" width="92" height="6" rx="3" fill="#9db4d4"/>
    <rect x="580" y="120" width="108" height="6" rx="3" fill="#d5dbe6"/>
    <line x1="640" y1="150" x2="640" y2="196" stroke="#0f2d52" stroke-width="1.5"/>
  </g>
  <!-- TODAY -->
  <g>
    <rect x="795" y="38" width="170" height="112" rx="10" fill="#e8f6f5" stroke="#0e7c86" stroke-width="2.5"/>
    <text x="880" y="60" font-size="14" text-anchor="middle" font-weight="700" fill="#0e7c86">TODAY</text>
    <text x="880" y="79" font-size="12.5" text-anchor="middle" font-style="italic" fill="#556">what you see in your folder</text>
    <rect x="820" y="96" width="120" height="6" rx="3" fill="#7cc4bd"/>
    <rect x="820" y="108" width="92" height="6" rx="3" fill="#7cc4bd"/>
    <rect x="820" y="120" width="108" height="6" rx="3" fill="#7cc4bd"/>
    <line x1="880" y1="150" x2="880" y2="196" stroke="#0e7c86" stroke-width="2"/>
  </g>

  <!-- timeline -->
  <line x1="60" y1="210" x2="940" y2="210" stroke="#0f2d52" stroke-width="3"/>
  <circle cx="140" cy="210" r="12" fill="#0f2d52"/>
  <circle cx="390" cy="210" r="12" fill="#0f2d52"/>
  <circle cx="640" cy="210" r="12" fill="#0f2d52"/>
  <circle cx="880" cy="210" r="14" fill="#0e7c86"/>

  <!-- compare: diff between Tuesday and Wednesday -->
  <path d="M395,228 C440,288 590,288 635,228" stroke="#0e7c86" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-start="url(#arc1)" marker-end="url(#arc1)"/>
  <text x="540" y="314" font-size="14.5" text-anchor="middle" fill="#0e7c86" font-weight="700">what changed from Tuesday to Wednesday?</text>
  <text x="540" y="334" font-size="13.5" text-anchor="middle" fill="#556">’ the diff: the exact list of changes, line by line</text>

  <!-- restore: go from TODAY back to Tuesday -->
  <path d="M880,232 C878,336 750,372 600,374 C450,376 342,352 376,252" stroke="#c05621" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="620" y="408" font-size="14.5" text-anchor="middle" fill="#c05621" font-weight="700">revert the introduction to how it was on Tuesday</text>
  <text x="620" y="428" font-size="13.5" text-anchor="middle" fill="#556">’ that photo is restored  and TODAY is saved too: nothing is lost</text>
</svg>
