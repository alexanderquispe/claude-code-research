<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/></marker></defs>

<rect x="20" y="120" width="230" height="120" rx="14" fill="#0f2d52"/>
<text x="135" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1 · UN solo login</text>
<text x="135" y="180" text-anchor="middle" font-size="14" fill="#9fb3c8">pucp.elogim.com</text>
<text x="135" y="206" text-anchor="middle" font-size="13.5" fill="#cfe0ea">su usuario y contraseña</text>
<text x="135" y="226" text-anchor="middle" font-size="13.5" fill="#cfe0ea">del <tspan font-weight="700">campus virtual</tspan></text>
<text x="135" y="272" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">una vez al día, en el navegador</text>

<path d="M258,180 L326,180" stroke="#0e7c86" stroke-width="3" fill="none" marker-end="url(#t)"/>
<text x="292" y="166" text-anchor="middle" font-size="12" fill="#475569">deja una</text>
<text x="292" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7c86">🍪 cookie</text>

<rect x="336" y="120" width="200" height="120" rx="14" fill="#e6f6f7" stroke="#0e7c86" stroke-width="2.5"/>
<text x="436" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0f2d52">2 · el navegador</text>
<text x="436" y="182" text-anchor="middle" font-size="14" fill="#475569">queda reconocido</text>
<text x="436" y="204" text-anchor="middle" font-size="14" fill="#475569">como <tspan font-weight="700" fill="#0f2d52">PUCP</tspan></text>
<text x="436" y="228" text-anchor="middle" font-size="12.5" font-style="italic" fill="#0e7c86">no como usted</text>

<path d="M544,180 L612,180" stroke="#0e7c86" stroke-width="3" fill="none" marker-end="url(#t)"/>

<text x="790" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#0f2d52">3 · todas las revistas, sin volver a entrar</text>
<g font-size="14.5">
<rect x="622" y="70" width="320" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e0"/><text x="646" y="97" fill="#475569">JSTOR</text><text x="918" y="97" text-anchor="end" fill="#0e7c86">✓ entra</text>
<rect x="622" y="120" width="320" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e0"/><text x="646" y="147" fill="#475569">Wiley · Science · AEA</text><text x="918" y="147" text-anchor="end" fill="#0e7c86">✓ entra</text>
<rect x="622" y="170" width="320" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e0"/><text x="646" y="197" fill="#475569">Cambridge · SAGE · Springer</text><text x="918" y="197" text-anchor="end" fill="#0e7c86">✓ entra</text>
<rect x="622" y="220" width="320" height="42" rx="9" fill="#fdf1e7" stroke="#c05621"/><text x="646" y="247" fill="#475569">Oxford · INFORMS</text><text x="918" y="247" text-anchor="end" fill="#c05621">✗ sin suscripción</text>
</g>
<text x="480" y="322" text-anchor="middle" font-size="15" fill="#0f2d52"><tspan font-weight="700">No</tspan> hay una cuenta por revista. <tspan font-weight="700">No</tspan> se registran en JSTOR ni en Wiley.</text>
<text x="480" y="346" text-anchor="middle" font-size="14" font-style="italic" fill="#94a3b8">La Universidad ya pagó; el proxy solo demuestra que ustedes son de la PUCP</text>
</svg>