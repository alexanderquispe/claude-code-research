<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<rect x="20" y="30" width="420" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e0" stroke-width="2"/>
<text x="230" y="70" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">Usted, a mano</text>
<text x="230" y="130" text-anchor="middle" font-size="52">🧑‍🏫</text>
<g font-size="15.5" fill="#475569">
<text x="60" y="180">1.  Buscar en Google Scholar, Scopus…</text>
<text x="60" y="212">2.  Abrir y leer cada resultado</text>
<text x="60" y="244">3.  Descartar lo que no aplica</text>
<text x="60" y="276">4.  Anotar, comparar, citar</text>
</g>
<text x="230" y="330" text-anchor="middle" font-size="26" font-weight="700" fill="#475569">≈ 2 a 3 semanas</text>
<text x="230" y="356" text-anchor="middle" font-size="14" font-style="italic" fill="#94a3b8">de tardes en la biblioteca</text>

<rect x="520" y="30" width="420" height="340" rx="16" fill="#e6f6f7" stroke="#0e7c86" stroke-width="2.5"/>
<text x="730" y="70" text-anchor="middle" font-size="21" font-weight="700" fill="#0f2d52">Con <tspan font-family="'SF Mono',Menlo,Consolas,monospace" fill="#0e7c86">/deep-research</tspan></text>
<g font-size="30">
<text x="576" y="132">🤖</text><text x="626" y="132">🤖</text><text x="676" y="132">🤖</text><text x="726" y="132">🤖</text><text x="776" y="132">🤖</text><text x="826" y="132">🤖</text>
<text x="576" y="172">🤖</text><text x="626" y="172">🤖</text><text x="676" y="172">🤖</text><text x="726" y="172">🤖</text><text x="776" y="172">🤖</text><text x="826" y="172">🤖</text>
</g>
<text x="884" y="155" font-size="17" font-weight="700" fill="#0e7c86">…y más</text>
<g font-size="15.5" fill="#0f2d52">
<text x="560" y="216">Todos buscan <tspan font-weight="700">a la vez</tspan>, cada uno por</text>
<text x="560" y="242">un ángulo distinto · leen · se corrigen</text>
<text x="560" y="268">entre ellos · entregan un informe citado</text>
