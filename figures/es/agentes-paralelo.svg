<text x="730" y="330" text-anchor="middle" font-size="26" font-weight="700" fill="#0e7c86">≈ 15 a 20 minutos</text>
<text x="730" y="356" text-anchor="middle" font-size="14" font-style="italic" fill="#94a3b8">mientras usted hace otra cosa</text>
