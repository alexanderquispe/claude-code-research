<svg viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c86"/>
    </marker>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- carril superior: Anthropic -->
  <rect x="10" y="30" width="980" height="244" rx="12" fill="#eef2f8" stroke="#0f2d52" stroke-width="1.5"/>
  <text x="28" y="62" font-size="18" font-weight="700" fill="#0f2d52">EN LOS SERVIDORES DE ANTHROPIC — el cerebro: <tspan fill="#c05621">Opus</tspan> (elegido en /model)</text>

  <!-- carril inferior: su computadora -->
  <rect x="10" y="296" width="980" height="240" rx="12" fill="#e8f6f5" stroke="#0e7c86" stroke-width="1.5"/>
  <text x="28" y="524" font-size="18" font-weight="700" fill="#0e7c86">EN SU COMPUTADORA — el obrero: <tspan fill="#c05621">Python + pdfplumber</tspan> (gratis, local)</text>

  <!-- A: planifica -->
  <rect x="38" y="96" width="196" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="52" y="128" font-size="17" fill="#0f2d52" font-weight="700">① Planifica</text>
  <text x="52" y="158" font-size="16" fill="#334">Entiende el pedido</text>
  <text x="52" y="182" font-size="16" fill="#334">y arma el plan</text>

  <!-- B: hojea -->
  <rect x="266" y="96" width="208" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="280" y="128" font-size="17" fill="#0f2d52"><tspan font-weight="700">② Hojea el PDF</tspan> <tspan font-size="13" fill="#889">Read</tspan></text>
  <text x="280" y="158" font-size="16" fill="#334">Lee 2–3 páginas para</text>
  <text x="280" y="182" font-size="16" fill="#334">entender el formato</text>
  <text x="280" y="206" font-size="16" fill="#334">de los casos</text>

  <!-- C: escribe script -->
  <rect x="506" y="96" width="212" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="520" y="128" font-size="17" fill="#0f2d52"><tspan font-weight="700">③ Escribe el código</tspan> <tspan font-size="13" fill="#889">Write</tspan></text>
  <text x="520" y="158" font-size="16" fill="#334">Un script de Python</text>
  <text x="520" y="182" font-size="16" fill="#334">(extraer.py) con la</text>
  <text x="520" y="206" font-size="16" fill="#334">librería <tspan font-weight="700">pdfplumber</tspan></text>

  <!-- D: corrige -->
  <rect x="750" y="96" width="212" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="764" y="128" font-size="17" fill="#0f2d52" font-weight="700">⑤ Lee los errores</text>
  <text x="764" y="158" font-size="16" fill="#334">¿Cuadra con los</text>
  <text x="764" y="182" font-size="16" fill="#334">totales? Corrige el</text>
  <text x="764" y="206" font-size="16" fill="#334">script y lo relanza</text>

  <!-- P: pedido -->
  <rect x="38" y="356" width="196" height="124" rx="10" fill="#0f2d52"/>
  <text x="52" y="388" font-size="16" fill="#ffffff" font-weight="700">Su pedido:</text>
  <text x="52" y="418" font-size="15" fill="#cfe0f4" font-style="italic">"Extrae todos los</text>
  <text x="52" y="440" font-size="15" fill="#cfe0f4" font-style="italic">casos de los reportes</text>
  <text x="52" y="462" font-size="15" fill="#cfe0f4" font-style="italic">a un CSV"</text>

  <!-- PDFs -->
  <rect x="266" y="356" width="208" height="124" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
  <text x="280" y="388" font-size="17" font-weight="700" fill="#0e7c86">Los 10 reportes PDF</text>
  <text x="280" y="418" font-size="16" fill="#334">~1 200 páginas de</text>
  <text x="280" y="442" font-size="16" fill="#334">la Defensoría</text>
  <text x="280" y="468" font-size="14" fill="#889">(nunca salen de aquí)</text>

  <!-- S: script corre -->
  <rect x="506" y="356" width="212" height="124" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
  <text x="520" y="388" font-size="17" fill="#0e7c86"><tspan font-weight="700">④ El script corre</tspan> <tspan font-size="13" fill="#889">Bash</tspan></text>
  <text x="520" y="418" font-size="16" fill="#334">Abre los 10 PDF y</text>
  <text x="520" y="442" font-size="16" fill="#334">saca cada caso — en</text>
  <text x="520" y="466" font-size="16" fill="#334">segundos, sin tokens</text>

  <!-- R: resultado -->
  <rect x="750" y="356" width="212" height="124" rx="10" fill="#fff7f2" stroke="#c05621" stroke-width="2.5"/>
  <text x="764" y="388" font-size="17" font-weight="700" fill="#c05621">casos.csv</text>
  <text x="764" y="418" font-size="16" fill="#334">Una fila por caso,</text>
  <text x="764" y="442" font-size="16" fill="#334">contrastada con las</text>
  <text x="764" y="466" font-size="16" fill="#334">tablas del reporte</text>

  <!-- flechas -->
  <path d="M136,356 L136,222" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M234,158 L264,158" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M368,222 L368,354" stroke="#0e7c86" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M394,354 L394,222" stroke="#0e7c86" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M474,158 L504,158" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M612,222 L612,354" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M718,438 L748,438" stroke="#c05621" stroke-width="3" fill="none" marker-end="url(#arw)"/>
  <path d="M732,396 L788,224" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M810,222 L688,352" stroke="#c05621" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="826" y="288" font-size="14.5" fill="#c05621" font-weight="700">se repite hasta</text>
  <text x="826" y="306" font-size="14.5" fill="#c05621" font-weight="700">que cuadre</text>

  <text x="500" y="562" font-size="16" text-anchor="middle" fill="#556">El modelo <tspan font-weight="700">razona y escribe código</tspan> · la lectura masiva la hace <tspan font-weight="700">el script, en su máquina</tspan></text>
</svg>
