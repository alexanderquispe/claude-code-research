<svg viewBox="0 0 1000 575" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="oar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c86"/>
    </marker>
    <marker id="oarw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- carril superior -->
  <rect x="10" y="30" width="980" height="244" rx="12" fill="#eef2f8" stroke="#0f2d52" stroke-width="1.5"/>
  <text x="28" y="62" font-size="18" font-weight="700" fill="#0f2d52">EL CEREBRO — <tspan fill="#c05621">Opus</tspan>: dirige, escribe los scripts, controla la calidad</text>

  <!-- carril inferior -->
  <rect x="10" y="296" width="980" height="240" rx="12" fill="#e8f6f5" stroke="#0e7c86" stroke-width="1.5"/>
  <text x="28" y="524" font-size="18" font-weight="700" fill="#0e7c86">SU COMPUTADORA — los obreros: <tspan fill="#c05621">PaddleOCR + Python</tspan> (gratis, local)</text>

  <!-- A: instala y escribe -->
  <rect x="60" y="96" width="240" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="76" y="128" font-size="17" fill="#0f2d52" font-weight="700">① Instala y escribe</text>
  <text x="76" y="158" font-size="16" fill="#334">Deja PaddleOCR listo y</text>
  <text x="76" y="182" font-size="16" fill="#334">escribe ocr.py, el script</text>
  <text x="76" y="206" font-size="16" fill="#334">que lo corre</text>

  <!-- B: valida -->
  <rect x="380" y="96" width="240" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="396" y="128" font-size="17" fill="#0f2d52" font-weight="700">③ Valida una muestra</text>
  <text x="396" y="158" font-size="16" fill="#334">Lee una página convertida:</text>
  <text x="396" y="182" font-size="16" fill="#334">¿se entiende? Si no,</text>
  <text x="396" y="206" font-size="16" fill="#334">ajusta y vuelve a correr</text>

  <!-- C: extrae -->
  <rect x="700" y="96" width="240" height="124" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="716" y="128" font-size="17" fill="#0f2d52" font-weight="700">④ Extrae y estructura</text>
  <text x="716" y="158" font-size="16" fill="#334">Con el texto ya plano,</text>
  <text x="716" y="182" font-size="16" fill="#334">saca los casos — igual</text>
  <text x="716" y="206" font-size="16" fill="#334">que con los PDF nuevos</text>

  <!-- P: escaneados -->
  <rect x="60" y="356" width="240" height="124" rx="10" fill="#0f2d52"/>
  <text x="76" y="388" font-size="17" fill="#ffffff" font-weight="700">📷 PDFs escaneados</text>
  <text x="76" y="418" font-size="15" fill="#cfe0f4" font-style="italic">reportes 2004–2015:</text>
  <text x="76" y="440" font-size="15" fill="#cfe0f4" font-style="italic">el PDF es una foto —</text>
  <text x="76" y="462" font-size="15" fill="#cfe0f4" font-style="italic">pdfplumber no ve nada</text>

  <!-- Q: paddleocr -->
  <rect x="380" y="356" width="240" height="124" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2.5"/>
  <text x="396" y="388" font-size="17" fill="#0e7c86" font-weight="700">② PaddleOCR corre</text>
  <text x="396" y="418" font-size="16" fill="#334">foto → texto, en su</text>
  <text x="396" y="442" font-size="16" fill="#334">máquina — sin tokens,</text>
  <text x="396" y="466" font-size="16" fill="#334">sin factura</text>
  <circle cx="612" cy="360" r="26" fill="#0e7c86"/>
  <text x="612" y="367" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">$0</text>

  <!-- R: resultado -->
  <rect x="700" y="356" width="240" height="124" rx="10" fill="#fff7f2" stroke="#c05621" stroke-width="2.5"/>
  <text x="716" y="388" font-size="17" font-weight="700" fill="#c05621">casos.csv, ampliado</text>
  <text x="716" y="418" font-size="16" fill="#334">los años viejos entran</text>
  <text x="716" y="442" font-size="16" fill="#334">a la misma base que</text>
  <text x="716" y="466" font-size="16" fill="#334">construyeron hoy</text>

  <!-- flechas -->
  <path d="M302,418 L378,418" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#oar)"/>
  <path d="M255,220 L425,354" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#oar)"/>
  <path d="M470,354 L470,222" stroke="#0e7c86" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#oar)"/>
  <path d="M505,222 L505,354" stroke="#c05621" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#oarw)"/>
  <path d="M628,400 L775,224" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#oar)"/>
  <text x="745" y="320" font-size="14.5" fill="#0e7c86" font-weight="700">texto plano</text>
  <path d="M850,220 L850,354" stroke="#c05621" stroke-width="3" fill="none" marker-end="url(#oarw)"/>

  <text x="500" y="566" font-size="16" text-anchor="middle" fill="#556">Lo caro (<tspan font-weight="700">razonar</tspan>) solo toca texto · las páginas-imagen las mastica <tspan font-weight="700">PaddleOCR, gratis</tspan></text>
</svg>
