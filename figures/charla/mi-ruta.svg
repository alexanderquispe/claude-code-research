<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- línea central -->
  <path d="M60,165 L940,165" stroke="#0f2d52" stroke-width="4"/>

