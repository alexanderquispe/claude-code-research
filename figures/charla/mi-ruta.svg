  <text x="500" y="317" font-size="16" text-anchor="middle" fill="#556">De <tspan font-weight="700" fill="#c05621">Economía en la PUCP</tspan> a un doctorado en <tspan font-weight="700" fill="#0e7c86">ciencias de la computación</tspan> — sin dejar de ser economista</text>
</svg>
