  <text x="100" y="121" font-size="13" text-anchor="middle" fill="#889">2013–2017</text>
  <line x1="90" y1="131" x2="90" y2="152" stroke="#c05621" stroke-width="2"/>

  <!-- Yale -->
  <circle cx="225" cy="165" r="11" fill="#0f2d52"/>
