<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#556"/>
    </marker>
    <marker id="tb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2d52"/>
    </marker>
  </defs>

  <!-- panel 1: solo -->
  <rect x="35" y="30" width="290" height="290" rx="14" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="180" y="66" font-size="19" text-anchor="middle" font-weight="700" fill="#0f2d52">Solo</text>
  <rect x="85" y="92" width="190" height="46" rx="9" fill="#eef2f8"/>
  <text x="180" y="121" font-size="15.5" text-anchor="middle" fill="#334">la persona escribe</text>
  <rect x="85" y="170" width="190" height="46" rx="9" fill="#f1f1f4"/>
  <text x="180" y="199" font-size="15.5" text-anchor="middle" fill="#334">código</text>
  <path d="M180,138 L180,166" stroke="#556" stroke-width="2.5" fill="none" marker-end="url(#ta)"/>
  <text x="180" y="252" font-size="15" text-anchor="middle" fill="#334">la persona revisa</text>
  <text x="180" y="290" font-size="15.5" text-anchor="middle" font-weight="700" fill="#889">IA: ausente</text>

  <!-- panel 2: copiloto -->
  <rect x="355" y="30" width="290" height="290" rx="14" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="500" y="66" font-size="19" text-anchor="middle" font-weight="700" fill="#0f2d52">Gen 1 · copiloto</text>
  <rect x="405" y="84" width="190" height="42" rx="9" fill="#fff3d6"/>
  <text x="500" y="111" font-size="15.5" text-anchor="middle" fill="#334">la IA sugiere</text>
  <rect x="405" y="152" width="190" height="42" rx="9" fill="#eef2f8"/>
  <text x="500" y="179" font-size="15.5" text-anchor="middle" fill="#334">la persona escribe</text>
  <rect x="405" y="220" width="190" height="42" rx="9" fill="#f1f1f4"/>
  <text x="500" y="247" font-size="15.5" text-anchor="middle" fill="#334">código</text>
  <path d="M500,126 L500,148" stroke="#556" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ta)"/>
  <path d="M500,194 L500,216" stroke="#556" stroke-width="2.5" fill="none" marker-end="url(#ta)"/>
  <text x="500" y="290" font-size="15.5" text-anchor="middle" font-weight="700" fill="#889">IA: sugerencias</text>

  <!-- panel 3: delegar -->
  <rect x="675" y="30" width="290" height="290" rx="14" fill="#e8f6f5" stroke="#0e7c86" stroke-width="3"/>
  <text x="820" y="66" font-size="19" text-anchor="middle" font-weight="700" fill="#0e7c86">Gen 2 · delegar</text>
  <rect x="725" y="84" width="190" height="42" rx="9" fill="#eef2f8"/>
  <text x="820" y="111" font-size="15.5" text-anchor="middle" fill="#334">la persona dirige</text>
  <rect x="725" y="152" width="190" height="42" rx="9" fill="#fff3d6"/>
  <text x="820" y="179" font-size="15.5" text-anchor="middle" fill="#334">el agente escribe</text>
  <rect x="725" y="220" width="190" height="42" rx="9" fill="#f1f1f4"/>
  <text x="820" y="247" font-size="15.5" text-anchor="middle" fill="#334">código</text>
  <path d="M820,126 L820,148" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ta)"/>
  <path d="M820,194 L820,216" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ta)"/>
  <text x="820" y="290" font-size="15.5" text-anchor="middle" font-weight="700" fill="#0e7c86">IA: ejecución</text>

  <!-- eje inferior -->
  <path d="M60,362 L940,362" stroke="#0f2d52" stroke-width="3" fill="none" marker-end="url(#tb)"/>
  <rect x="330" y="344" width="340" height="36" rx="18" fill="#0f2d52"/>
  <text x="500" y="368" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700">la ejecución migra hacia la IA</text>
  <text x="120" y="392" font-size="14" fill="#889">en los tres casos, la persona revisa</text>
</svg>
