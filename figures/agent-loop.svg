<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/></marker></defs>
<rect x="100" y="30" width="310" height="80" rx="12" fill="#eef2f7" stroke="#0f2d52" stroke-width="2"/>
<text x="124" y="63" font-size="19" font-weight="700" fill="#0f2d52"><tspan fill="#0e7c86">1 · </tspan>GATHER CONTEXT</text>
<text x="124" y="91" font-size="15" fill="#475569">read files · search · git log</text>
<rect x="560" y="30" width="310" height="80" rx="12" fill="#eef2f7" stroke="#0f2d52" stroke-width="2"/>
<text x="584" y="63" font-size="19" font-weight="700" fill="#0f2d52"><tspan fill="#0e7c86">2 · </tspan>TAKE ACTION</text>
<text x="584" y="91" font-size="15" fill="#475569">edit files · run scripts</text>
<rect x="560" y="250" width="310" height="80" rx="12" fill="#eef2f7" stroke="#0f2d52" stroke-width="2"/>
<text x="584" y="283" font-size="19" font-weight="700" fill="#0f2d52"><tspan fill="#0e7c86">3 · </tspan>VERIFY</text>
<text x="584" y="311" font-size="15" fill="#475569">run tests · read the output</text>
<rect x="100" y="250" width="310" height="80" rx="12" fill="#eef2f7" stroke="#0f2d52" stroke-width="2"/>
<text x="124" y="283" font-size="19" font-weight="700" fill="#0f2d52"><tspan fill="#0e7c86">4 · </tspan>REPEAT</text>
<text x="124" y="311" font-size="15" fill="#475569">until the task is done</text>
<path d="M415,70 L552,70" stroke="#0e7c86" stroke-width="3" fill="none" marker-end="url(#arT)"/>
<path d="M715,115 L715,242" stroke="#0e7c86" stroke-width="3" fill="none" marker-end="url(#arT)"/>
<path d="M555,290 L418,290" stroke="#0e7c86" stroke-width="3" fill="none" marker-end="url(#arT)"/>
<path d="M255,245 L255,118" stroke="#0e7c86" stroke-width="3" fill="none" marker-end="url(#arT)"/>
<text x="485" y="175" text-anchor="middle" font-size="19" font-weight="700" fill="#0f2d52">the agent loop</text>
<text x="485" y="202" text-anchor="middle" font-size="14.5" font-style="italic" fill="#94a3b8">your permission gates every risky step</text>
