<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ba" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2d52"/>
    </marker>
    <marker id="bb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
  </defs>

  <!-- desarrollador -->
  <rect x="40" y="60" width="260" height="150" rx="14" fill="#eef2f8" stroke="#0f2d52" stroke-width="2.5"/>
  <text x="170" y="95" font-size="19" text-anchor="middle" font-weight="700" fill="#0f2d52">Persona capaz</text>
  <text x="170" y="126" font-size="16" text-anchor="middle" fill="#334">entiende el problema</text>
  <text x="170" y="150" font-size="16" text-anchor="middle" fill="#334">conoce el tema</text>
  <text x="170" y="174" font-size="16" text-anchor="middle" fill="#334">sabe juzgar una solución</text>

  <!-- barrera -->
  <rect x="370" y="60" width="260" height="150" rx="14" fill="#fff7e6" stroke="#c05621" stroke-width="3"/>
  <text x="500" y="95" font-size="19" text-anchor="middle" font-weight="700" fill="#c05621">La barrera</text>
  <text x="500" y="126" font-size="16" text-anchor="middle" fill="#334">el proyecto exige un lenguaje</text>
  <text x="500" y="150" font-size="16" text-anchor="middle" fill="#334">que no domina (Rust, C++…)</text>
  <text x="500" y="174" font-size="16" text-anchor="middle" fill="#334">escribirlo es lento y riesgoso</text>

  <!-- proyecto -->
  <rect x="700" y="60" width="260" height="150" rx="14" fill="#eef2f8" stroke="#0f2d52" stroke-width="2.5"/>
  <text x="830" y="95" font-size="19" text-anchor="middle" font-weight="700" fill="#0f2d52">Proyecto valioso</text>
  <text x="830" y="126" font-size="16" text-anchor="middle" fill="#334">se beneficiaría de su talento</text>
  <text x="830" y="158" font-size="16.5" text-anchor="middle" font-weight="700" fill="#c05621">…pero no se produce</text>

  <!-- flechas y tachado -->
  <path d="M302,135 L366,135" stroke="#0f2d52" stroke-width="3.5" fill="none" marker-end="url(#ba)"/>
  <path d="M632,135 L696,135" stroke="#0f2d52" stroke-width="3.5" fill="none" marker-end="url(#ba)"/>
  <circle cx="664" cy="135" r="15" fill="#ffffff" stroke="#c05621" stroke-width="2.5"/>
  <path d="M655,126 L673,144 M655,144 L673,126" stroke="#c05621" stroke-width="3"/>

  <!-- puente del agente -->
  <path d="M170,213 C240,300 760,300 830,213" stroke="#0e7c86" stroke-width="3.5" fill="none" stroke-dasharray="9 6" marker-end="url(#bb)"/>
  <rect x="310" y="272" width="380" height="46" rx="23" fill="#0e7c86"/>
  <text x="500" y="302" font-size="17.5" text-anchor="middle" fill="#ffffff" font-weight="700">¿Puede un agente de IA cruzar la barrera?</text>
</svg>
