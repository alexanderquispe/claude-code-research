<svg viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c86"/>
    </marker>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- carril superior: Anthropic -->
  <rect x="10" y="34" width="980" height="240" rx="12" fill="#eef2f8" stroke="#0f2d52" stroke-width="1.5"/>
  <text x="30" y="62" font-size="16" font-weight="700" fill="#0f2d52">EN LOS SERVIDORES DE ANTHROPIC — el cerebro: <tspan fill="#c05621">Opus</tspan> (el modelo que eligieron en /model)</text>

  <!-- carril inferior: su computadora -->
  <rect x="10" y="296" width="980" height="240" rx="12" fill="#e8f6f5" stroke="#0e7c86" stroke-width="1.5"/>
  <text x="30" y="522" font-size="16" font-weight="700" fill="#0e7c86">EN SU COMPUTADORA — sus archivos y el obrero: <tspan fill="#c05621">Python + pdfplumber</tspan> (gratis, local)</text>

  <!-- A: planifica -->
  <rect x="40" y="100" width="190" height="120" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="55" y="128" font-size="15" fill="#0f2d52"><tspan font-weight="700">① Planifica</tspan></text>
  <text x="55" y="152" font-size="14" fill="#334">Entiende el pedido</text>
  <text x="55" y="172" font-size="14" fill="#334">y decide los pasos</text>
  <text x="55" y="192" font-size="14" fill="#334">a seguir</text>

  <!-- B: hojea -->
  <rect x="270" y="100" width="200" height="120" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="285" y="128" font-size="15" fill="#0f2d52"><tspan font-weight="700">② Hojea el PDF</tspan> <tspan font-size="12" fill="#889">Read</tspan></text>
  <text x="285" y="152" font-size="14" fill="#334">Lee 2–3 páginas de</text>
  <text x="285" y="172" font-size="14" fill="#334">muestra para entender</text>
  <text x="285" y="192" font-size="14" fill="#334">el formato de los casos</text>

  <!-- C: escribe script -->
  <rect x="510" y="100" width="205" height="120" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="525" y="128" font-size="15" fill="#0f2d52"><tspan font-weight="700">③ Escribe el código</tspan> <tspan font-size="12" fill="#889">Write</tspan></text>
  <text x="525" y="152" font-size="14" fill="#334">Un script de Python</text>
  <text x="525" y="172" font-size="14" fill="#334">(extraer.py) que usa la</text>
  <text x="525" y="192" font-size="14" fill="#334">librería <tspan font-weight="700">pdfplumber</tspan></text>

  <!-- D: corrige -->
  <rect x="755" y="100" width="205" height="120" rx="10" fill="#ffffff" stroke="#0f2d52" stroke-width="2"/>
  <text x="770" y="128" font-size="15" fill="#0f2d52"><tspan font-weight="700">⑤ Lee errores y salida</tspan></text>
  <text x="770" y="152" font-size="14" fill="#334">¿Faltan casos? ¿Cuadra</text>
  <text x="770" y="172" font-size="14" fill="#334">con los totales? Corrige</text>
  <text x="770" y="192" font-size="14" fill="#334">el script y lo relanza</text>

  <!-- P: pedido -->
  <rect x="40" y="360" width="190" height="120" rx="10" fill="#0f2d52"/>
  <text x="55" y="390" font-size="14" fill="#ffffff" font-weight="700">Su pedido, en el terminal:</text>
  <text x="55" y="416" font-size="13" fill="#cfe0f4" font-style="italic">"Extrae todos los casos</text>
  <text x="55" y="434" font-size="13" fill="#cfe0f4" font-style="italic">de los reportes</text>
  <text x="55" y="452" font-size="13" fill="#cfe0f4" font-style="italic">a un CSV"</text>

  <!-- PDFs -->
  <rect x="270" y="360" width="200" height="120" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
  <text x="285" y="390" font-size="15" font-weight="700" fill="#0e7c86">Los 10 reportes PDF</text>
  <text x="285" y="414" font-size="14" fill="#334">~1 200 páginas de la</text>
  <text x="285" y="434" font-size="14" fill="#334">Defensoría del Pueblo</text>
  <text x="285" y="458" font-size="13" fill="#889">(nunca salen completos de aquí)</text>

  <!-- S: script corre -->
  <rect x="510" y="360" width="205" height="120" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
  <text x="525" y="390" font-size="15" fill="#0e7c86"><tspan font-weight="700">④ El script corre</tspan> <tspan font-size="12" fill="#889">Bash</tspan></text>
  <text x="525" y="414" font-size="14" fill="#334">extraer.py abre los 10</text>
  <text x="525" y="434" font-size="14" fill="#334">PDF y saca cada caso —</text>
  <text x="525" y="454" font-size="14" fill="#334">en segundos, sin tokens</text>

  <!-- R: resultado -->
  <rect x="755" y="360" width="205" height="120" rx="10" fill="#fff7f2" stroke="#c05621" stroke-width="2.5"/>
  <text x="770" y="390" font-size="15" font-weight="700" fill="#c05621">casos.csv</text>
  <text x="770" y="414" font-size="14" fill="#334">Una fila por caso,</text>
  <text x="770" y="434" font-size="14" fill="#334">contrastado con las tablas</text>
  <text x="770" y="454" font-size="14" fill="#334">del propio reporte</text>

  <!-- flechas -->
  <path d="M135,360 L135,222" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M230,160 L268,160" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M370,222 L370,358" stroke="#0e7c86" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M395,358 L395,222" stroke="#0e7c86" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M470,160 L508,160" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M612,222 L612,358" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M715,438 L753,438" stroke="#c05621" stroke-width="3" fill="none" marker-end="url(#arw)"/>
  <path d="M735,400 L780,224" stroke="#0e7c86" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M800,222 L680,356" stroke="#c05621" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="822" y="290" font-size="13" fill="#c05621" font-weight="700">se repite hasta</text>
  <text x="822" y="307" font-size="13" fill="#c05621" font-weight="700">que cuadre</text>

  <text x="500" y="559" font-size="14.5" text-anchor="middle" fill="#556">El modelo <tspan font-weight="700">razona y escribe código</tspan> · la lectura masiva de los PDF la hace <tspan font-weight="700">el script, gratis y en su máquina</tspan></text>
</svg>
