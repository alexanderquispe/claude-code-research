<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="art" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- línea de tiempo -->
  <line x1="70" y1="170" x2="930" y2="170" stroke="#0f2d52" stroke-width="3"/>

  <!-- fotos (commits) -->
  <g>
    <circle cx="140" cy="170" r="13" fill="#0f2d52"/>
    <rect x="60" y="60" width="160" height="76" rx="9" fill="#eef2f8" stroke="#0f2d52" stroke-width="1.5"/>
    <text x="140" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#0f2d52">lunes</text>
    <text x="140" y="108" font-size="13.5" text-anchor="middle" fill="#334">"punto de partida"</text>
    <line x1="140" y1="136" x2="140" y2="155" stroke="#0f2d52" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="390" cy="170" r="13" fill="#0f2d52"/>
    <rect x="310" y="60" width="160" height="76" rx="9" fill="#eef2f8" stroke="#0f2d52" stroke-width="1.5"/>
    <text x="390" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#0f2d52">martes</text>
    <text x="390" y="108" font-size="13.5" text-anchor="middle" fill="#334">"introducción</text>
    <text x="390" y="126" font-size="13.5" text-anchor="middle" fill="#334">reescrita"</text>
    <line x1="390" y1="136" x2="390" y2="155" stroke="#0f2d52" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="640" cy="170" r="13" fill="#0f2d52"/>
    <rect x="560" y="60" width="160" height="76" rx="9" fill="#eef2f8" stroke="#0f2d52" stroke-width="1.5"/>
    <text x="640" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#0f2d52">miércoles</text>
    <text x="640" y="108" font-size="13.5" text-anchor="middle" fill="#334">"tablas de la</text>
    <text x="640" y="126" font-size="13.5" text-anchor="middle" fill="#334">Defensoría listas"</text>
    <line x1="640" y1="136" x2="640" y2="155" stroke="#0f2d52" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="880" cy="170" r="15" fill="#0e7c86"/>
    <rect x="810" y="60" width="140" height="76" rx="9" fill="#e8f6f5" stroke="#0e7c86" stroke-width="2"/>
    <text x="880" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#0e7c86">HOY</text>
    <text x="880" y="108" font-size="13.5" text-anchor="middle" fill="#334">lo que ven en</text>
    <text x="880" y="126" font-size="13.5" text-anchor="middle" fill="#334">su carpeta</text>
    <line x1="880" y1="136" x2="880" y2="153" stroke="#0e7c86" stroke-width="1.5"/>
  </g>

  <!-- cada punto: una foto -->
  <text x="140" y="212" font-size="13" text-anchor="middle" fill="#889">foto completa</text>
  <text x="390" y="212" font-size="13" text-anchor="middle" fill="#889">foto completa</text>
  <text x="640" y="212" font-size="13" text-anchor="middle" fill="#889">foto completa</text>

  <!-- diff -->
  <path d="M390,240 C450,275 580,275 640,240" stroke="#0e7c86" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <text x="515" y="292" font-size="14.5" text-anchor="middle" fill="#0e7c86" font-weight="700">"¿qué cambió entre el martes y el miércoles?"</text>
  <text x="515" y="312" font-size="13.5" text-anchor="middle" fill="#556">→ la lista exacta de cambios (el diff), línea por línea</text>

  <!-- revertir -->
  <path d="M878,246 C884,356 520,358 410,262" stroke="#c05621" stroke-width="3" fill="none" marker-end="url(#art)"/>
  <text x="640" y="390" font-size="14.5" text-anchor="middle" fill="#c05621" font-weight="700">"vuelve la introducción a como estaba el martes"</text>
  <text x="640" y="410" font-size="13.5" text-anchor="middle" fill="#556">→ se restaura esa foto; nada se pierde, HOY también queda guardado</text>
</svg>
