<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- central question -->
  <rect x="330" y="20" width="340" height="52" rx="26" fill="#0f2d52"/>
  <text x="500" y="53" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">How was my file before?</text>

  <!-- left option: the conversation -->
  <g opacity="0.92">
    <rect x="40" y="120" width="420" height="200" rx="14" fill="#f7f7f9" stroke="#b9bec9" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="70" y="156" font-size="17" font-weight="700" fill="#8a8f9c">L Ask the conversation</text>
    <text x="70" y="192" font-size="15" fill="#666c7a">Chat memory <tspan font-weight="700">gets summarized and discarded</tspan></text>
    <text x="70" y="216" font-size="15" fill="#666c7a">as the session grows or closes.</text>
    <text x="70" y="248" font-size="15" fill="#666c7a">And an overwritten file <tspan font-weight="700">doesnt keep</tspan></text>
    <text x="70" y="272" font-size="15" fill="#666c7a">its own past.</text>
    <text x="70" y="304" font-size="14" fill="#8a8f9c" font-style="italic">Claude can remember it& until it cant.</text>
  </g>

  <!-- right option: git -->
  <rect x="540" y="120" width="420" height="200" rx="14" fill="#e8f6f5" stroke="#0e7c86" stroke-width="2.5"/>
  <text x="570" y="156" font-size="17" font-weight="700" fill="#0e7c86"> Ask the repository</text>
  <text x="570" y="192" font-size="15" fill="#334">Each saved version lives <tspan font-weight="700">on your disk</tspan>,</text>
  <text x="570" y="216" font-size="15" fill="#334">in the hidden <tspan font-weight="700" font-family="Menlo, monospace" font-size="14">.git</tspan> folder  complete,</text>
  <text x="570" y="240" font-size="15" fill="#334">with date and message, <tspan font-weight="700">forever</tspan>.</text>
  <text x="570" y="276" font-size="15" fill="#334">Claude doesnt remember: <tspan font-weight="700" fill="#0e7c86">it queries and restores</tspan>.</text>
  <text x="570" y="304" font-size="14" fill="#556" font-style="italic">Survives the chat, restarts, and forgetting.</text>

  <!-- arrows from the question -->
  <path d="M420,72 C350,90 300,100 260,118" stroke="#b9bec9" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
  <path d="M580,72 C650,90 700,100 740,118" stroke="#0e7c86" stroke-width="3" fill="none"/>

  <text x="500" y="362" font-size="15" text-anchor="middle" fill="#556">Rule: <tspan font-weight="700" fill="#c05621">dont ask Claudes memory for versions  save them in Git and consult them</tspan></text>
</svg>
